name: trade-core

services:
    app:
        build:
            context: ..
            dockerfile: _docker/Dockerfile
            args:
                UID: ${LOCAL_UID:-1000}
                GID: ${LOCAL_GID:-1000}

        working_dir: /var/www/html

        volumes:
            - ..:/var/www/html

        env_file:
            - ../.env

        environment:
            APP_ENV: local
            APP_DEBUG: "true"

            DB_CONNECTION: pgsql
            DB_HOST: database
            DB_PORT: 5432

            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379

            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis

            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025

        entrypoint:
            - /bin/sh
            - /var/www/html/_docker/entrypoint.sh

        command:
            - php-fpm
            - -F

        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy

        restart: unless-stopped

    nginx:
        image: nginx:stable-alpine

        ports:
            - "127.0.0.1:80:80"

        volumes:
            - ..:/var/www/html:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

        depends_on:
            app:
                condition: service_started

        restart: unless-stopped

    node:
        image: node:26.9-alpine

        working_dir: /var/www/html

        user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

        environment:
            HOME: /tmp
            NPM_CONFIG_CACHE: /tmp/npm-cache

        volumes:
            - ..:/var/www/html

        ports:
            - "127.0.0.1:5173:5173"

        command:
            - npm
            - run
            - dev
            - --
            - --host
            - "0.0.0.0"

        restart: unless-stopped

    database:
        image: postgres:19-alpine

        ports:
            - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"

        environment:
            POSTGRES_DB: ${DB_DATABASE:-trade_core}
            POSTGRES_USER: ${DB_USERNAME:-trade_core}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}

        volumes:
            - postgres_data:/var/lib/postgresql

        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

        restart: unless-stopped

    redis:
        image: redis:8.10.3-alpine

        command:
            - redis-server
            - --appendonly
            - "yes"

        volumes:
            - redis_data:/data

        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 10s
            timeout: 5s
            retries: 5

        restart: unless-stopped

    mailpit:
        image: axllent/mailpit:latest

        ports:
            - "127.0.0.1:8025:8025"

        restart: unless-stopped

volumes:
    postgres_data:
        driver: local

    redis_data:
        driver: local
